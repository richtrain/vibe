*,*::before,*::after{box-sizing:border-box}
html,body,h1,h2,h3,p,figure,ul,li{margin:0;padding:0}
ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}

:root{
  --bg:#FBFBFC; --paper:#FFFFFF; --ink:#0B0B0C; --ink2:#71757C; --ink3:#9BA0A7;
  --line:#E7E8EB; --line2:#F1F2F4; --hair:#D3D6DB; --accent:#1B39D4;
  --chrome:#F7F7F9; --shadow:0 20px 44px -26px rgba(11,11,12,.30);
  --c1:#DE3D66; --c2:#DD6B12; --c3:#0F9B57; --c4:#2A63DC; --c5:#7444DC; --c6:#0892A0;
  --r:2px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090A; --paper:#101012; --ink:#F3F3F4; --ink2:#8B8F96; --ink3:#6A6E75;
    --line:#1D1E21; --line2:#161718; --hair:#2E3035; --accent:#8FA2FF;
    --chrome:#151517; --shadow:0 20px 44px -24px #000;
  --c1:#FF7392; --c2:#FF9B4D; --c3:#35D68C; --c4:#7CA2FF; --c5:#B294FF; --c6:#3FCDDA;
    --c1:#FF7392; --c2:#FF9B4D; --c3:#35D68C; --c4:#7CA2FF; --c5:#B294FF; --c6:#3FCDDA;
  }
}
:root[data-theme="dark"]{
  --bg:#09090A; --paper:#101012; --ink:#F3F3F4; --ink2:#8B8F96; --ink3:#6A6E75;
  --line:#1D1E21; --line2:#161718; --hair:#2E3035; --accent:#8FA2FF;
  --chrome:#151517; --shadow:0 20px 44px -24px #000;
  --c1:#FF7392; --c2:#FF9B4D; --c3:#35D68C; --c4:#7CA2FF; --c5:#B294FF; --c6:#3FCDDA;
}

body{background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.inner{max-width:1080px;margin:0 auto;padding:0 28px}

/* ---- top bar ---- */
.top{border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
.mark{display:flex;align-items:center;gap:9px}
.mark svg{width:20px;height:20px;flex:none}
.mark b{font-family:"Syne",sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.cnt{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--ink3);
  font-variant-numeric:tabular-nums}

/* ---- hero ---- */
.hero{padding:76px 0 0}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:20px}
h1{font-family:"Syne",sans-serif;font-weight:800;font-size:clamp(38px,7vw,68px);
  line-height:.96;letter-spacing:-.035em;text-wrap:balance}
.lead,.ds,.nm,.empty p{text-wrap:pretty}
.lead{margin-top:20px;font-size:clamp(15px,1.7vw,18px);color:var(--ink2);max-width:34ch;line-height:1.6}

/* ---- controls ---- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:52px;
  padding-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:7px;background:none;cursor:pointer;font-size:12.5px;
  color:var(--ink2);border:1px solid var(--line);border-radius:100px;padding:5px 13px;
  transition:border-color .18s,color .18s,background .18s;--c:var(--ink3)}
.chip:hover{border-color:var(--hair);color:var(--ink)}
.chip .cd{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.chip .cc{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600;border-color:var(--ink)}
.chip[aria-pressed="true"] .cc{color:var(--ink2)}
.srch{position:relative;width:190px}
.srch input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  padding:5px 0 5px 20px;font-size:13px;outline:none;transition:border-color .18s}
.srch input::placeholder{color:var(--ink3)}
.srch input:focus{border-bottom-color:var(--ink)}
.srch::before{content:"";position:absolute;left:2px;top:9px;width:9px;height:9px;
  border:1.4px solid var(--ink3);border-radius:50%}
.srch::after{content:"";position:absolute;left:10px;top:18px;width:5px;height:1.4px;
  background:var(--ink3);transform:rotate(45deg)}
select{background:none;border:0;border-bottom:1px solid var(--line);padding:5px 2px;
  font-size:13px;color:var(--ink2);cursor:pointer;outline:none}

/* ---- cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:18px;margin-top:10px}
.cell{position:relative;display:flex;--c:var(--ink3)}
.cell.anim{opacity:0;transform:translateY(12px);
  animation:rise .55s cubic-bezier(.22,.68,.28,1) forwards;animation-delay:calc(var(--i) * 65ms)}
@keyframes rise{to{opacity:1;transform:none}}
.card{display:flex;flex-direction:column;width:100%;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;text-decoration:none;color:inherit;
  transition:transform .26s cubic-bezier(.22,.68,.28,1),box-shadow .26s ease,border-color .2s ease}
.cell:hover .card{transform:translateY(-4px);border-color:var(--hair);box-shadow:var(--shadow)}
.cell:hover .card{border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.chrome{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--chrome);
  background:color-mix(in srgb,var(--c) 8%,var(--chrome));
  border-bottom:1px solid var(--line2);transition:background .22s}
.cell:hover .chrome{background:color-mix(in srgb,var(--c) 15%,var(--chrome))}
.dots{display:flex;gap:5px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink3);opacity:.3}
.dots i:first-child{background:var(--c);opacity:.9}
.addr{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.cell:hover .addr{color:var(--ink2)}
.body{padding:24px 22px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.tg{display:inline-flex;align-self:flex-start;align-items:center;font-style:normal;
  font-size:11.5px;font-weight:600;letter-spacing:-.01em;color:var(--c);
  background:color-mix(in srgb,var(--c) 12%,transparent);padding:4px 10px;border-radius:100px}
.nm{font-size:23px;font-weight:600;letter-spacing:-.034em;line-height:1.24}
.ds{font-size:13.5px;color:var(--ink2);line-height:1.65;flex:1}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;
  padding-top:15px;border-top:1px solid var(--line2);
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--ink3)}
.ar{color:var(--c);opacity:0;transform:translate(-5px,4px);
  transition:opacity .24s,transform .24s cubic-bezier(.22,.68,.28,1)}
.cell:hover .ar{opacity:1;transform:none}

/* ---- admin ---- */
.tools{position:absolute;right:16px;bottom:14px;display:none;gap:6px;z-index:3}
body.admin .cell:hover .tools,body.admin .tools:focus-within{display:flex}
body.admin .cell:hover .ar{opacity:0}
.tools button{width:26px;height:26px;display:grid;place-items:center;background:var(--paper);
  border:1px solid var(--hair);border-radius:100px;cursor:pointer;font-size:11px;color:var(--ink2)}
.tools button:hover{border-color:var(--ink);color:var(--ink)}
.tools button.armed{width:auto;padding:0 10px;font-size:10px;border-color:var(--ink);color:var(--ink)}
#addBtn,#bulkBtn,#expBtn{display:none}
body.admin #addBtn,body.admin #bulkBtn,body.admin #expBtn{display:inline-flex}
.adminbar{display:none;align-items:center;gap:10px;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--ink3)}
body.admin .adminbar{display:inline-flex}
.adminbar .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.adminbar button,.btn{background:none;border:1px solid var(--hair);border-radius:100px;
  padding:5px 12px;font-size:11px;color:var(--ink2);cursor:pointer;font-family:inherit;
  letter-spacing:0;transition:border-color .18s,color .18s}
.adminbar button:hover,.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:7px 15px}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.solid:hover{opacity:.86;color:var(--bg)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px}
.robar{display:none;margin-top:22px;padding:11px 15px;border:1px solid var(--line);
  border-left:2px solid var(--accent);border-radius:var(--r);font-size:13px;color:var(--ink2)}
body.admin .robar{display:block}

/* ---- empty / footer ---- */
.empty{padding:90px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty h2{font-size:19px;font-weight:600;letter-spacing:-.02em}
.empty p{color:var(--ink2);font-size:14px;max-width:40ch}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:70px;
  padding:20px 0 64px;border-top:1px solid var(--line2);
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;color:var(--ink3)}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(6,6,8,.55);backdrop-filter:blur(3px);
  display:none;place-items:center;padding:20px;z-index:60}
.scrim.on{display:grid}
.sheet{width:min(500px,100%);max-height:86vh;overflow:auto;background:var(--bg);
  border:1px solid var(--hair);border-radius:6px}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px}
.sheet header h2{font-size:16px;font-weight:600;letter-spacing:-.02em}
.sheet .in{padding:6px 22px 20px;display:flex;flex-direction:column;gap:15px}
label{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--ink3);
  font-family:"JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
label input,label textarea{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;font-family:inherit;font-size:14px;letter-spacing:-.01em;text-transform:none;
  color:var(--ink);outline:none;transition:border-color .18s}
label textarea{min-height:120px;resize:vertical;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.65}
label input:focus,label textarea:focus{border-color:var(--ink)}
.hint{font-family:inherit;font-size:12px;letter-spacing:-.01em;text-transform:none;color:var(--ink3);line-height:1.55}
.sheet footer{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px}
.x{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--ink3);padding:0}
.x:hover{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);opacity:0;
  pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:11px 19px;
  border-radius:100px;z-index:70;transition:.22s;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}
  .cell.anim{opacity:1;transform:none}}
@media (max-width:760px){
  .inner{padding:0 20px}.hero{padding:52px 0 0}
  .grid{grid-template-columns:1fr;gap:14px}
  .body{padding:20px 18px 16px}
  .nm{font-size:21px}
  .ar{opacity:1;transform:none}
  body.admin .tools{display:flex}
  .bar{margin-top:36px}.srch{width:100%;order:-1}
}
</style>

    var m=(location.search||'').match(/[?&]admin=([^&]*)/);
    if(m){
      var ok=false;
      try{ ok=decodeURIComponent(m[1])===ADMIN_KEY; }catch(e){ ok=m[1]===ADMIN_KEY; }
      if(ok){
        try{ localStorage.setItem('vibeshelf.admin','1'); }catch(e){}
        try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
        return true;
      }
      return false;
    }
    try{ return localStorage.getItem('vibeshelf.admin')==='1'; }catch(e){ return false; }
  }
  function setAdmin(on){ isAdmin=!!on; document.body.classList[on?'add':'remove']('admin'); }
  function signOut(){
    try{ localStorage.removeItem('vibeshelf.admin'); }catch(e){}
    setAdmin(false); grid(); toast('관리자 모드를 해제했어.');
  }

  function staticList(s){
    var rows=(s.items||[]).slice().sort(function(a,b){return (b.added||0)-(a.added||0);})
      .map(function(i){
        return '<li><a href="'+esc(i.url)+'">'+esc(i.title)+'</a>'+
          (i.tag?' <em>'+esc(i.tag)+'</em>':'')+
          (i.note?' — '+esc(i.note):'')+'</li>';
      }).join('');
    return '<div class="inner"><h1>Tony Factory</h1><p>'+DESC+'</p><ul>'+rows+'</ul></div>';
  }
  function buildDoc(s){
    var sty=document.getElementById('sty').textContent;
    var app=document.getElementById('app').textContent;
    var json=JSON.stringify(s).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>토니팩토리-vibe coding products<\/title>\n'+META+'\n'+FONTS+
      '\n<style id="sty">'+sty+'<\/style>\n<\/head>\n<body>\n'+
      '<div id="root">'+staticList(s)+'<\/div>\n<div id="toast"><\/div>\n'+
      '<script type="application/json" id="data">'+json+'<\/script>\n'+
      '<script id="app">'+app+'<\/script>\n<\/body>\n<\/html>';
  }
  function readOnly(){setAdmin(false);}

  function saveLocal(){ try{ localStorage.setItem('vibeshelf.v1', JSON.stringify(state)); }catch(e){} }

  function exportDoc(){
    try{
      var blob=new Blob([buildDoc(state)],{type:'text/html;charset=utf-8'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='index.html';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
      toast('index.html 로 내보냈어. 이걸 배포하면 내용이 고정돼.');
    }catch(e){ toast('내보내기에 실패했어.'); }
  }

  /* ---------- GitHub 커밋 ---------- */
  var GH_KEY='vibeshelf.gh';
  var gh={repo:'',branch:'main',path:'index.html',token:''};
  try{ var _g=JSON.parse(localStorage.getItem(GH_KEY)||'null'); if(_g) for(var k in _g) gh[k]=_g[k]; }catch(e){}
  function ghReady(){ return !!(gh.repo && gh.token); }
  function ghStore(){ try{ localStorage.setItem(GH_KEY, JSON.stringify(gh)); }catch(e){} }
  function ghForget(){ gh={repo:'',branch:'main',path:'index.html',token:''};
    try{ localStorage.removeItem(GH_KEY); }catch(e){} ghBadge(); }
  function b64(str){
    var bytes=new TextEncoder().encode(str), bin='';
    for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function ghApi(path,opts){
    opts=opts||{}; opts.headers={
      'Authorization':'Bearer '+gh.token,
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    };
    return fetch('https://api.github.com'+path,opts);
  }
  async function ghMsg(r){
    var t=''; try{ var j=await r.json(); t=j.message||''; }catch(e){}
    if(r.status===401) return '토큰이 올바르지 않아 (401)';
    if(r.status===403) return '권한이 없거나 요청이 너무 잦아 (403)';
    if(r.status===404) return '저장소나 파일 경로를 못 찾겠어 (404) — 저장소 이름, 경로, 토큰 권한을 확인해줘';
    return (t||'알 수 없는 오류')+' ('+r.status+')';
  }
  function ghUrl(){ return '/repos/'+gh.repo+'/contents/'+gh.path.split('/').map(encodeURIComponent).join('/'); }
  async function ghSha(){
    var r=await ghApi(ghUrl()+'?ref='+encodeURIComponent(gh.branch)+'&t='+Date.now());
    if(r.status===200){ var j=await r.json(); return j.sha; }
    if(r.status===404) return null;
    throw new Error(await ghMsg(r));
  }
  async function ghCommit(html){
    var body={message:'Update '+gh.path+' via tony factory', content:b64(html), branch:gh.branch};
    var sha=await ghSha(); if(sha) body.sha=sha;
    var r=await ghApi(ghUrl(),{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422){
      var s2=await ghSha(); if(s2) body.sha=s2; else delete body.sha;
      r=await ghApi(ghUrl(),{method:'PUT',body:JSON.stringify(body)});
    }
    if(!r.ok) throw new Error(await ghMsg(r));
  }

  async function persist(){
    if(!ready){toast('저장 준비 중이야. 잠깐 뒤에 다시.');return;}
    state.rev=Date.now();
    saveLocal();
    if(api){
      toast('저장 중…');
      try{ await api.publish(buildDoc(state)); }
      catch(e){
        var c=(e&&e.code)||'upstream_error';
        if(c==='conflict'){toast('다른 곳에서 먼저 저장됐어. 최신 버전으로 새로고침돼.');}
        else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'){readOnly();toast('보기 전용 화면이라 저장되지 않았어.');}
        else if(c==='rate_limited'){toast('저장이 너무 잦아. 잠깐 뒤에 다시.');}
        else if(c==='too_large'){toast('내용이 너무 커서 저장할 수 없어.');}
        else{toast('저장에 실패했어. 다시 시도해줘.');}
      }
      return;
    }
    if(ghReady()){
      toast('GitHub에 올리는 중…');
      try{ await ghCommit(buildDoc(state)); toast('커밋 완료 — 1~2분 뒤 사이트에 반영돼.'); }
      catch(e){ toast('GitHub 저장 실패: '+((e&&e.message)||e)); }
      return;
    }
    toast('이 브라우저에만 저장됐어. GitHub를 연결하면 사이트에 바로 반영돼.');
  }

  /* ---------- shell ---------- */
  function shell(){
    root.innerHTML=
      '<header class="top"><div class="inner tb">'+
        '<span class="mark">'+MARK+'<b>Tony Factory</b></span>'+
        '<span class="cnt">제품 <span id="cnt">0</span></span>'+
      '</div></header>'+
      '<div class="inner">'+
        '<section class="hero">'+
          '<div class="eyebrow">Product Index</div>'+
          '<h1>Tony Factory</h1>'+
          '<p class="lead">'+DESC+'</p>'+
          '<div class="robar" id="robar"></div>'+
        '</section>'+
        '<div class="bar">'+
          '<div class="chips" id="chips"></div>'+
          '<div class="srch"><input id="q" type="search" placeholder="검색" autocomplete="off"></div>'+
          '<select id="sort"><option value="new">최신순</option><option value="old">오래된순</option><option value="az">가나다순</option></select>'+
          '<button class="btn" id="bulkBtn">여러 개 붙여넣기</button>'+'<button class="btn" id="expBtn">내보내기</button>'+
          '<button class="btn solid" id="addBtn">제품 추가</button>'+
          '<span class="adminbar"><span class="dot"></span>관리자 <button id="ghBtn">GitHub</button> <button id="signOutBtn">해제</button></span>'+
        '</div>'+
        '<div class="grid" id="grid"></div>'+
        '<div class="foot"><span>Tony Factory</span><span id="stamp"></span></div>'+
      '</div>'+
      '<div class="scrim" id="ghScrim"><div class="sheet" role="dialog" aria-modal="true">'+
        '<header><h2>GitHub 연결</h2><button class="x" id="ghClose" aria-label="닫기">&times;</button></header>'+
        '<div class="in">'+
          '<label>저장소<input id="ghRepo" placeholder="richtrain/vibe" autocapitalize="off" autocomplete="off"></label>'+
          '<label>브랜치<input id="ghBranch" placeholder="main" autocapitalize="off" autocomplete="off"></label>'+
          '<label>파일 경로<input id="ghPath" placeholder="index.html" autocapitalize="off" autocomplete="off"></label>'+
          '<label>토큰<input id="ghToken" type="password" placeholder="github_pat_..." autocomplete="off">'+
            '<span class="hint">Fine-grained token에 이 저장소의 Contents: Read and write 권한만 주면 돼. 토큰은 이 브라우저에만 저장돼.</span></label>'+
        '</div>'+
        '<footer><button class="btn" id="ghForget">연결 해제</button><button class="btn" id="ghCancel">취소</button><button class="btn solid" id="ghOk">연결 확인 후 저장</button></footer>'+
      '</div></div>'+
      '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">'+
        '<header><h2 id="shTitle">제품 추가</h2><button class="x" id="closeBtn" aria-label="닫기">&times;</button></header>'+
        '<div class="in" id="formOne">'+
          '<label>이름<input id="fTitle" placeholder="주식자판기"></label>'+
          '<label>주소<input id="fUrl" placeholder="https://..." inputmode="url"></label>'+
          '<label>태그<input id="fTag" placeholder="투자 / 도구 / 실험"></label>'+
          '<label>한 줄 설명<input id="fNote" placeholder="뭘 하는 건지 한 줄로"></label>'+
        '</div>'+
        '<div class="in" id="formBulk" hidden>'+
          '<label>한 줄에 하나씩<textarea id="fBulk" placeholder="주식자판기 | https://stockvm.onrender.com | 투자&#10;https://another.example.com"></textarea>'+
          '<span class="hint">주소만 붙여넣어도 되고, <span class="mono">이름 | 주소 | 태그</span> 형식으로 쓰면 그대로 들어가.</span></label>'+
        '</div>'+
        '<footer><button class="btn" id="cancelBtn">취소</button><button class="btn solid" id="saveBtn">저장</button></footer>'+
      '</div></div>';

    var now=new Date();
    document.getElementById('stamp').textContent='업데이트 '+now.getFullYear()+'.'+pad2(now.getMonth()+1)+'.'+pad2(now.getDate());
    document.getElementById('q').addEventListener('input',function(e){ui.q=e.target.value.trim().toLowerCase();grid();});
    document.getElementById('sort').addEventListener('change',function(e){ui.sort=e.target.value;grid();});
    document.getElementById('addBtn').addEventListener('click',function(){openSheet(null,false);});
    document.getElementById('signOutBtn').addEventListener('click',signOut);
    document.getElementById('ghBtn').addEventListener('click',ghOpen);
    document.getElementById('ghClose').addEventListener('click',ghCloseSheet);
    document.getElementById('ghCancel').addEventListener('click',ghCloseSheet);
    document.getElementById('ghForget').addEventListener('click',function(){ghForget();ghCloseSheet();toast('GitHub 연결을 해제했어.');});
    document.getElementById('ghOk').addEventListener('click',ghConnect);
    document.getElementById('ghScrim').addEventListener('mousedown',function(e){if(e.target.id==='ghScrim')ghCloseSheet();});
    document.getElementById('bulkBtn').addEventListener('click',function(){openSheet(null,true);});
    document.getElementById('expBtn').addEventListener('click',exportDoc);
    document.getElementById('closeBtn').addEventListener('click',close);
    document.getElementById('cancelBtn').addEventListener('click',close);
    document.getElementById('saveBtn').addEventListener('click',commit);
    document.getElementById('scrim').addEventListener('mousedown',function(e){if(e.target.id==='scrim')close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){close();ghCloseSheet();}});
    ghBadge();
  }

  function ghBadge(){
    var b=document.getElementById('ghBtn'); if(!b)return;
    b.textContent = ghReady()? 'GitHub 연결됨' : 'GitHub 연결';
    b.style.borderColor = ghReady()? '' : 'var(--accent)';
    b.style.color = ghReady()? '' : 'var(--accent)';
    var r=document.getElementById('robar');
    if(r) r.textContent = api ? '관리자 모드 — 변경하면 곧바로 저장돼.'
      : ghReady() ? '관리자 모드 — 변경하면 GitHub에 커밋되고 1~2분 뒤 사이트에 반영돼.'
      : '관리자 모드 — 지금은 이 브라우저에만 저장돼. GitHub를 연결하면 사이트에 바로 반영돼.';
  }
  function ghOpen(){
    document.getElementById('ghRepo').value=gh.repo||'';
    document.getElementById('ghBranch').value=gh.branch||'main';
    document.getElementById('ghPath').value=gh.path||'index.html';
    document.getElementById('ghToken').value=gh.token||'';
    document.getElementById('ghScrim').classList.add('on');
    setTimeout(function(){document.getElementById('ghRepo').focus();},30);
  }
  function ghCloseSheet(){document.getElementById('ghScrim').classList.remove('on');}
  async function ghConnect(){
    var repo=document.getElementById('ghRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
    var branch=document.getElementById('ghBranch').value.trim()||'main';
    var path=document.getElementById('ghPath').value.trim().replace(/^\//,'')||'index.html';
    var token=document.getElementById('ghToken').value.trim();
    if(!/^[^\/\s]+\/[^\/\s]+$/.test(repo)){toast('저장소는 사용자명/저장소명 형식으로 적어줘.');return;}
    if(!token){toast('토큰을 입력해줘.');return;}
    var prev={repo:gh.repo,branch:gh.branch,path:gh.path,token:gh.token};
    gh={repo:repo,branch:branch,path:path,token:token};
    toast('연결 확인 중…');
    try{
      await ghSha();
      ghStore(); ghBadge(); ghCloseSheet();
      toast('연결됐어. 이제 추가·수정하면 바로 커밋돼.');
    }catch(e){ gh=prev; toast('연결 실패: '+((e&&e.message)||e)); }
  }

  var editing=null,bulk=false;
  function openSheet(item,isBulk){
    editing=item;bulk=!!isBulk;
    document.getElementById('shTitle').textContent=isBulk?'여러 개 붙여넣기':(item?'제품 수정':'제품 추가');
    document.getElementById('formOne').hidden=!!isBulk;
    document.getElementById('formBulk').hidden=!isBulk;
    document.getElementById('fTitle').value=item?item.title:'';
    document.getElementById('fUrl').value=item?item.url:'';
    document.getElementById('fTag').value=item&&item.tag?item.tag:'';
    document.getElementById('fNote').value=item&&item.note?item.note:'';
    document.getElementById('fBulk').value='';
    document.getElementById('scrim').classList.add('on');
    setTimeout(function(){document.getElementById(isBulk?'fBulk':'fTitle').focus();},30);
  }
  function close(){document.getElementById('scrim').classList.remove('on');editing=null;}

  function commit(){
    if(bulk){
      var lines=document.getElementById('fBulk').value.split('\n'),added=0;
      lines.forEach(function(ln){
        ln=ln.trim();if(!ln)return;
        var p=ln.split('|').map(function(s){return s.trim();});
        var url='',title='',tag='';
        if(p.length===1){url=norm(p[0]);title=host(url);}
        else{ if(/^https?:\/\//i.test(p[0])){url=norm(p[0]);title=host(url);}
              else{title=p[0];url=norm(p[1]||'');tag=p[2]||'';} }
        if(!url)return;
        state.items.push({id:uid(),title:title||host(url),url:url,tag:tag,note:'',added:Date.now()});
        added++;
      });
      if(!added){toast('추가할 주소를 찾지 못했어.');return;}
      toast(added+'개 추가됨');
    }else{
      var t=document.getElementById('fTitle').value.trim();
      var u=norm(document.getElementById('fUrl').value);
      if(!u){toast('주소를 입력해줘.');return;}
      var o={title:t||host(u),url:u,tag:document.getElementById('fTag').value.trim(),note:document.getElementById('fNote').value.trim()};
      if(editing){for(var k in o)editing[k]=o[k];}
      else{o.id=uid();o.added=Date.now();state.items.push(o);}
    }
    close();grid();persist();
  }
  function remove(id){state.items=state.items.filter(function(i){return i.id!==id;});grid();persist();}

  function tags(){var m={};state.items.forEach(function(i){if(i.tag)m[i.tag]=1;});return Object.keys(m).sort();}
  function view(){
    var out=state.items.filter(function(i){
      if(ui.tag&&i.tag!==ui.tag)return false;
      if(!ui.q)return true;
      return ((i.title||'')+' '+(i.note||'')+' '+(i.url||'')+' '+(i.tag||'')).toLowerCase().indexOf(ui.q)>-1;
    });
    out.sort(function(a,b){
      if(ui.sort==='az')return (a.title||'').localeCompare(b.title||'','ko');
      if(ui.sort==='old')return (a.added||0)-(b.added||0);
      return (b.added||0)-(a.added||0);
    });
    return out;
  }

  function grid(){
    document.getElementById('cnt').textContent=pad2(state.items.length);
    var ch=document.getElementById('chips'),tg=tags();
    mapColors(tg);
    var cnt={};state.items.forEach(function(i){if(i.tag)cnt[i.tag]=(cnt[i.tag]||0)+1;});
    ch.innerHTML = tg.length? ('<button class="chip" data-tag="" aria-pressed="'+(ui.tag===''?'true':'false')+'">전체'+
      '<span class="cc">'+state.items.length+'</span></button>'+
      tg.map(function(t){return '<button class="chip" data-tag="'+esc(t)+'" style="--c:'+hue(t)+'" aria-pressed="'+
        (ui.tag===t?'true':'false')+'"><span class="cd"></span>'+esc(t)+
        '<span class="cc">'+cnt[t]+'</span></button>';}).join('')) : '';
    Array.prototype.forEach.call(ch.querySelectorAll('.chip'),function(b){
      b.addEventListener('click',function(){ui.tag=b.getAttribute('data-tag');grid();});
    });

    var g=document.getElementById('grid'),list=view();
    if(!state.items.length){
      g.innerHTML='<div class="empty"><h2>아직 아무것도 없어</h2><p>'+
        (isAdmin?'띄워둔 링크를 하나씩 올려봐.':'준비 중입니다.')+'</p></div>';
      return;
    }
    if(!list.length){g.innerHTML='<div class="empty"><h2>검색 결과가 없어</h2><p>검색어나 태그를 바꿔봐.</p></div>';return;}

    var anim=firstPaint?' anim':''; firstPaint=false;
    g.innerHTML=list.map(function(i,n){
      return '<div class="cell'+anim+'" data-id="'+esc(i.id)+'" style="--i:'+n+(i.tag?';--c:'+hue(i.tag):'')+'">'+
        '<a class="card" href="'+esc(i.url)+'" target="_blank" rel="noopener noreferrer">'+
          '<span class="chrome"><span class="dots"><i></i><i></i><i></i></span>'+
            '<span class="addr">'+esc(host(i.url))+'</span></span>'+
          '<span class="body">'+
            (i.tag?'<em class="tg">'+esc(i.tag)+'</em>':'')+
            '<span class="nm">'+esc(i.title)+'</span>'+
            '<span class="ds">'+esc(i.note||'')+'</span>'+
            '<span class="cfoot"><span>'+ym(i.added)+'</span><span class="ar">열기 &#8599;</span></span>'+
          '</span>'+
        '</a>'+
        '<div class="tools">'+
          '<button data-act="edit" title="수정" aria-label="수정">&#9998;</button>'+
          '<button data-act="del" title="삭제" aria-label="삭제">&#10005;</button>'+
        '</div></div>';
    }).join('');

    Array.prototype.forEach.call(g.querySelectorAll('.tools button'),function(b){
      b.addEventListener('click',function(e){
        e.preventDefault();e.stopPropagation();
        var id=b.closest('.cell').getAttribute('data-id');
        var item=state.items.filter(function(x){return x.id===id;})[0];
        if(b.getAttribute('data-act')==='edit'){openSheet(item,false);return;}
        if(armed===id){armed=null;remove(id);return;}
        armed=id;b.classList.add('armed');b.textContent='삭제?';
        setTimeout(function(){if(armed===id){armed=null;b.classList.remove('armed');b.textContent='✕';}},3000);
      });
    });
  }

  setAdmin(checkAdmin());
  shell();grid();
  ready=true;
})();
</script>
</body>
</html>
