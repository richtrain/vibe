<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="바이브코딩으로 만들어봄. by tony">
<meta property="og:type" content="website">
<meta property="og:title" content="Vibe Coded Products">
<meta property="og:site_name" content="Vibe Coded Products">
<meta property="og:description" content="바이브코딩으로 만들어봄. by tony">
<meta name="twitter:card" content="summary">
<title>Vibe Coded Products</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="sty">
*,*::before,*::after{box-sizing:border-box}
html,body,h1,h2,h3,p,figure,ul,li{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}

:root{
  --bg:#EFF1F4; --paper:#FFFFFF; --ink:#0E1013; --ink2:#5C6470;
  --line:#D9DEE5; --line2:#EAEDF1;
  --brand:#0F2FD1; --on-brand:#FFFFFF; --signal:#E8410F;
  --r:2px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08090B; --paper:#121418; --ink:#ECEFF3; --ink2:#848C97;
    --line:#22262C; --line2:#191C21;
    --brand:#2743E8; --on-brand:#FFFFFF; --signal:#FF7A45;
  }
}
:root[data-theme="dark"]{
  --bg:#08090B; --paper:#121418; --ink:#ECEFF3; --ink2:#848C97;
  --line:#22262C; --line2:#191C21;
  --brand:#2743E8; --on-brand:#FFFFFF; --signal:#FF7A45;
}

body{background:var(--bg);color:var(--ink);
  font-family:"Instrument Sans",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.inner{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---- masthead ---- */
.mast{padding:36px 0 0}
.masttop{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  padding-bottom:15px;border-bottom:1px solid var(--line)}
h1{font-family:"Syne","Instrument Sans",sans-serif;font-weight:700;
  font-size:clamp(25px,3.4vw,34px);line-height:1.06;letter-spacing:-.03em}
.by{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--ink2);margin-top:8px}
.meta{font-size:12px;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}

/* ---- controls ---- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:20px 0 0}
.field{position:relative;flex:1 1 220px;min-width:180px}
.field input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 13px 10px 32px;font-size:13.5px;outline:none}
.field::before{content:"";position:absolute;left:12px;top:50%;width:9px;height:9px;margin-top:-6px;
  border:1.5px solid var(--ink2);border-radius:50%}
.field::after{content:"";position:absolute;left:20px;top:50%;width:5px;height:1.5px;margin-top:3px;
  background:var(--ink2);transform:rotate(45deg)}
.field input:focus{border-color:var(--brand)}
select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);
  border:1px solid var(--ink);border-radius:var(--r);padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:16px 0 0}
.chip{font-size:12px;background:transparent;
  border:1px solid var(--line);color:var(--ink2);border-radius:100px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---- grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px;padding:22px 0 0}
.cell{position:relative;display:flex}
.card{position:relative;display:flex;flex-direction:column;width:100%;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;
  padding:15px 16px 13px;gap:7px;
  transition:border-color .15s ease,transform .15s ease}
.cell:hover .card{border-color:var(--ink);transform:translateY(-2px)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:14px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--signal)}
.date{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--ink2);
  font-variant-numeric:tabular-nums;flex:none}
.card h3{font-weight:600;font-size:17px;line-height:1.2;letter-spacing:-.01em;
  text-wrap:balance;margin-top:1px}
.note{font-size:13px;color:var(--ink2);line-height:1.5;flex:1}
.foot{display:flex;align-items:center;gap:8px;padding-top:10px;padding-right:56px;border-top:1px solid var(--line2)}
.host{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open{position:absolute;right:16px;bottom:13px;font-size:11.5px;color:var(--ink2);pointer-events:none;transition:opacity .16s}
.cell:hover .open{opacity:0}
.tools{position:absolute;right:12px;bottom:10px;display:flex;gap:5px;opacity:0;transition:opacity .16s}
.cell:hover .tools,.tools:focus-within{opacity:1}
.tools button{width:24px;height:24px;display:grid;place-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:2px;cursor:pointer;font-size:11px;color:var(--ink2)}
.tools button:hover{border-color:var(--ink);color:var(--ink)}
.tools button.danger:hover{border-color:var(--signal);color:var(--signal)}
.tools button.armed{width:auto;padding:0 7px;font-size:9.5px;letter-spacing:.05em;border-color:var(--signal);color:var(--signal)}
body.ro .tools,body.ro #addBtn,body.ro #bulkBtn{display:none}

/* ---- empty / footer ---- */
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:var(--r);background:var(--paper);
  padding:56px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty h2{font-weight:600;font-size:19px;letter-spacing:-.01em}
.empty p{color:var(--ink2);font-size:14px;max-width:40ch}
.colophon{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:36px;padding:14px 0 52px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
.robar{display:none;margin-top:20px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);
  border-left:3px solid var(--signal);border-radius:var(--r);font-size:13px;color:var(--ink2)}
body.ro .robar{display:block}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(6,8,11,.62);display:none;place-items:center;padding:20px;z-index:50}
.scrim.on{display:grid}
.sheet{width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line2)}
.sheet header h2{font-weight:600;font-size:16px;letter-spacing:-.01em}
.sheet .in{padding:20px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink2)}
label input,label textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  font-family:"Instrument Sans",sans-serif;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);outline:none}
label textarea{min-height:120px;resize:vertical;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.6}
label input:focus,label textarea:focus{border-color:var(--brand)}
.hint{font-family:"Instrument Sans",sans-serif;font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink2)}
.sheet footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line2)}
.x{background:transparent;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--ink2)}
.x:hover{color:var(--ink)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-size:13px;padding:10px 18px;border-radius:100px;z-index:60;transition:.2s}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:620px){.mast{padding:26px 0 0}.inner{padding:0 18px}.open{display:none}.tools{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script type="application/json" id="data">{"items": [{"id": "stockvm", "title": "주식자판기", "url": "https://stockvm.onrender.com/", "tag": "투자", "note": "DART 공시와 재무 데이터로 종목 분석 리포트를 뽑고, 저평가 종목을 매일 골라주는 AI 분석 도구.", "added": 1787702400000}, {"id": "placepanda", "title": "플레이스판다", "url": "https://placepanda.vercel.app/", "tag": "마케팅", "note": "네이버 플레이스 키워드 검색량·경쟁도 조회와 순위 변화 추적을 한 화면에서. 뷰티샵 원장용.", "added": 1787788800000}]}</script>
<script id="app">
(function(){
  var DESC='바이브코딩으로 만들어 띄워둔 것들을 한 곳에. by tony';
  var META='<meta name="description" content="'+DESC+'">'+
    '<meta property="og:type" content="website">'+
    '<meta property="og:title" content="Vibe Coded Products">'+
    '<meta property="og:site_name" content="Vibe Coded Products">'+
    '<meta property="og:description" content="'+DESC+'">'+
    '<meta name="twitter:card" content="summary">';
  var FONTS='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">';
  var state, api=null, ready=false, ui={q:'',tag:'',sort:'new'}, armed=null;

  try{ state=JSON.parse(document.getElementById('data').textContent)||{}; }catch(e){ state={}; }
  if(!Array.isArray(state.items)) state.items=[];
  try{ var LS=localStorage.getItem('vibeshelf.v1');
       if(LS){ var pp=JSON.parse(LS); if(pp&&Array.isArray(pp.items)) state=pp; } }catch(e){}

  var root=document.getElementById('root');
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function uid(){return Math.random().toString(36).slice(2,9);}
  function norm(u){u=(u||'').trim();if(!u)return'';return /^https?:\/\//i.test(u)?u:'https://'+u;}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u.replace(/^https?:\/\//,'').split('/')[0];}}
  function ymd(t){var d=new Date(t||Date.now());var p=function(n){return(n<10?'0':'')+n;};return String(d.getFullYear()).slice(2)+'.'+p(d.getMonth()+1)+'.'+p(d.getDate());}
  function pad2(n){return (n<10?'0':'')+n;}
  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2600);}

  function buildDoc(s){
    var sty=document.getElementById('sty').textContent;
    var app=document.getElementById('app').textContent;
    var json=JSON.stringify(s).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>Vibe Coded Products<\/title>\n'+META+'\n'+FONTS+'\n<style id="sty">'+sty+'<\/style>\n<\/head>\n<body>\n'+
      '<div id="root"><\/div>\n<div id="toast"><\/div>\n'+
      '<script type="application/json" id="data">'+json+'<\/script>\n'+
      '<script id="app">'+app+'<\/script>\n<\/body>\n<\/html>';
  }
  function readOnly(){document.body.classList.add('ro');}
  async function persist(){
    try{ localStorage.setItem('vibeshelf.v1', JSON.stringify(state)); toast('​저장됨 — 이 브라우저에'.replace('​','')); }
    catch(e){ toast('이 브라우저에 저장할 수 없어. 내보내기로 백업해줘.'); }
  }
  function exportDoc(){
    try{
      var blob=new Blob([buildDoc(state)],{type:'text/html;charset=utf-8'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='index.html';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
      toast('index.html 로 내보냈어. 이걸 다시 배포하면 내용이 고정돼.');
    }catch(e){ toast('내보내기에 실패했어.'); }
  }

  /* ---------- shell ---------- */
  function shell(){
    root.innerHTML=
      '<header class="mast"><div class="inner"><div class="masttop">'+
        '<div><h1>Vibe Coded Products</h1><p class="by">by. tony</p></div>'+
        '<div class="meta">제품 <span id="cnt">0</span> · 태그 <span id="tcnt">0</span></div>'+
      '</div></div></header>'+
      '<div class="inner">'+
        '<div class="robar">이 브라우저에만 저장돼. 다른 기기에서도 보이게 하려면 내보내기 후 다시 배포해줘.</div>'+
        '<div class="bar">'+
          '<div class="field"><input id="q" type="search" placeholder="이름, 설명, 주소로 검색" autocomplete="off"></div>'+
          '<select id="sort"><option value="new">최신순</option><option value="old">오래된순</option><option value="az">가나다순</option></select>'+
          '<button class="btn ghost" id="bulkBtn">여러 개 붙여넣기</button>'+'<button class="btn ghost" id="expBtn">내보내기</button>'+
          '<button class="btn" id="addBtn">+ 제품 추가</button>'+
        '</div>'+
        '<div class="chips" id="chips"></div>'+
        '<div class="grid" id="grid"></div>'+
        '<div class="colophon"><span>by. tony</span><span id="stamp"></span></div>'+
      '</div>'+
      '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">'+
        '<header><h2 id="shTitle">제품 추가</h2><button class="x" id="closeBtn" aria-label="닫기">&times;</button></header>'+
        '<div class="in" id="formOne">'+
          '<label>이름<input id="fTitle" placeholder="주식자판기"></label>'+
          '<label>주소<input id="fUrl" placeholder="https://..." inputmode="url"></label>'+
          '<label>태그<input id="fTag" placeholder="투자 / 도구 / 실험"></label>'+
          '<label>한 줄 설명<input id="fNote" placeholder="뭘 하는 건지 한 줄로"></label>'+
        '</div>'+
        '<div class="in" id="formBulk" hidden>'+
          '<label>한 줄에 하나씩<textarea id="fBulk" placeholder="주식자판기 | https://stockvm.onrender.com | 투자&#10;https://another.example.com"></textarea>'+
          '<span class="hint">주소만 붙여넣어도 되고, <span class="mono">이름 | 주소 | 태그</span> 형식으로 쓰면 그대로 들어가.</span></label>'+
        '</div>'+
        '<footer><button class="btn ghost" id="cancelBtn">취소</button><button class="btn" id="saveBtn">저장</button></footer>'+
      '</div></div>';

    var now=new Date();
    document.getElementById('stamp').textContent='업데이트 '+now.getFullYear()+'.'+pad2(now.getMonth()+1)+'.'+pad2(now.getDate());
    document.getElementById('q').addEventListener('input',function(e){ui.q=e.target.value.trim().toLowerCase();grid();});
    document.getElementById('sort').addEventListener('change',function(e){ui.sort=e.target.value;grid();});
    document.getElementById('addBtn').addEventListener('click',function(){openSheet(null,false);});
    document.getElementById('bulkBtn').addEventListener('click',function(){openSheet(null,true);});
    document.getElementById('expBtn').addEventListener('click',exportDoc);
    document.getElementById('closeBtn').addEventListener('click',close);
    document.getElementById('cancelBtn').addEventListener('click',close);
    document.getElementById('saveBtn').addEventListener('click',commit);
    document.getElementById('scrim').addEventListener('mousedown',function(e){if(e.target.id==='scrim')close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  }

  var editing=null,bulk=false;
  function openSheet(item,isBulk){
    editing=item;bulk=!!isBulk;
    document.getElementById('shTitle').textContent=isBulk?'여러 개 붙여넣기':(item?'제품 수정':'제품 추가');
    document.getElementById('formOne').hidden=!!isBulk;
    document.getElementById('formBulk').hidden=!isBulk;
    document.getElementById('fTitle').value=item?item.title:'';
    document.getElementById('fUrl').value=item?item.url:'';
    document.getElementById('fTag').value=item&&item.tag?item.tag:'';
    document.getElementById('fNote').value=item&&item.note?item.note:'';
    document.getElementById('fBulk').value='';
    document.getElementById('scrim').classList.add('on');
    setTimeout(function(){document.getElementById(isBulk?'fBulk':'fTitle').focus();},30);
  }
  function close(){document.getElementById('scrim').classList.remove('on');editing=null;}

  function commit(){
    if(bulk){
      var lines=document.getElementById('fBulk').value.split('\n'),added=0;
      lines.forEach(function(ln){
        ln=ln.trim();if(!ln)return;
        var p=ln.split('|').map(function(s){return s.trim();});
        var url='',title='',tag='';
        if(p.length===1){url=norm(p[0]);title=host(url);}
        else{ if(/^https?:\/\//i.test(p[0])){url=norm(p[0]);title=host(url);}
              else{title=p[0];url=norm(p[1]||'');tag=p[2]||'';} }
        if(!url)return;
        state.items.push({id:uid(),title:title||host(url),url:url,tag:tag,note:'',added:Date.now()});
        added++;
      });
      if(!added){toast('추가할 주소를 찾지 못했어.');return;}
      toast(added+'개 추가됨');
    }else{
      var t=document.getElementById('fTitle').value.trim();
      var u=norm(document.getElementById('fUrl').value);
      if(!u){toast('링크를 입력해줘.');return;}
      var o={title:t||host(u),url:u,tag:document.getElementById('fTag').value.trim(),note:document.getElementById('fNote').value.trim()};
      if(editing){for(var k in o)editing[k]=o[k];}
      else{o.id=uid();o.added=Date.now();state.items.push(o);}
    }
    close();grid();persist();
  }
  function remove(id){state.items=state.items.filter(function(i){return i.id!==id;});grid();persist();}

  function tags(){var m={};state.items.forEach(function(i){if(i.tag)m[i.tag]=1;});return Object.keys(m).sort();}
  function view(){
    var out=state.items.filter(function(i){
      if(ui.tag&&i.tag!==ui.tag)return false;
      if(!ui.q)return true;
      return ((i.title||'')+' '+(i.note||'')+' '+(i.url||'')+' '+(i.tag||'')).toLowerCase().indexOf(ui.q)>-1;
    });
    out.sort(function(a,b){
      if(ui.sort==='az')return (a.title||'').localeCompare(b.title||'','ko');
      if(ui.sort==='old')return (a.added||0)-(b.added||0);
      return (b.added||0)-(a.added||0);
    });
    return out;
  }

  function grid(){
    document.getElementById('cnt').textContent=pad2(state.items.length);
    document.getElementById('tcnt').textContent=pad2(tags().length);
    var ch=document.getElementById('chips'),tg=tags();
    ch.innerHTML = tg.length? ('<button class="chip" data-tag="" aria-pressed="'+(ui.tag===''?'true':'false')+'">전체</button>'+
      tg.map(function(t){return '<button class="chip" data-tag="'+esc(t)+'" aria-pressed="'+(ui.tag===t?'true':'false')+'">'+esc(t)+'</button>';}).join('')) : '';
    Array.prototype.forEach.call(ch.querySelectorAll('.chip'),function(b){
      b.addEventListener('click',function(){ui.tag=b.getAttribute('data-tag');grid();});
    });

    var g=document.getElementById('grid'),list=view();
    if(!state.items.length){
      g.innerHTML='<div class="empty"><h2>아직 아무것도 없어</h2>'+
        '<p>띄워둔 링크를 하나씩 올려봐. 여러 개면 주소를 통째로 붙여넣어도 돼.</p>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+
        '<button class="btn" id="e1">+ 첫 번째 추가</button>'+
        '<button class="btn ghost" id="e2">여러 개 붙여넣기</button></div></div>';
      var e1=document.getElementById('e1'),e2=document.getElementById('e2');
      if(e1)e1.addEventListener('click',function(){openSheet(null,false);});
      if(e2)e2.addEventListener('click',function(){openSheet(null,true);});
      return;
    }
    if(!list.length){g.innerHTML='<div class="empty"><h2>검색 결과가 없어</h2><p>검색어나 태그를 바꿔봐.</p></div>';return;}

    g.innerHTML=list.map(function(i){
      return '<div class="cell" data-id="'+esc(i.id)+'">'+
        '<a class="card" href="'+esc(i.url)+'" target="_blank" rel="noopener noreferrer">'+
          '<div class="row"><span class="tag">'+esc(i.tag||'')+'</span><span class="date">'+ymd(i.added)+'</span></div>'+
          '<h3>'+esc(i.title)+'</h3>'+
          '<p class="note">'+esc(i.note||'')+'</p>'+
          '<div class="foot"><span class="host">'+esc(host(i.url))+'</span></div>'+
        '</a>'+
        '<span class="open">열기 ↗</span>'+
        '<div class="tools">'+
          '<button data-act="edit" title="수정" aria-label="수정">✎</button>'+
          '<button data-act="del" class="danger" title="삭제" aria-label="삭제">✕</button>'+
        '</div></div>';
    }).join('');

    Array.prototype.forEach.call(g.querySelectorAll('.tools button'),function(b){
      b.addEventListener('click',function(e){
        e.preventDefault();e.stopPropagation();
        var id=b.closest('.cell').getAttribute('data-id');
        var item=state.items.filter(function(x){return x.id===id;})[0];
        if(b.getAttribute('data-act')==='edit'){openSheet(item,false);return;}
        if(armed===id){armed=null;remove(id);return;}
        armed=id;b.classList.add('armed');b.textContent='삭제?';
        setTimeout(function(){if(armed===id){armed=null;b.classList.remove('armed');b.textContent='✕';}},3000);
      });
    });
  }

  shell();grid();
  ready=true;
})();
</script>
</body>
</html>
